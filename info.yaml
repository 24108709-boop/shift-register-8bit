---
# Tiny Tapeout project information
project:
  source_files:
    - "tt_um_shift_register_8bit.v"
  top_module:  "tt_um_shift_register_8bit"
  author:      "Mai Quang Anh"
  github:      ""
  description: "8-bit Universal Shift Register for Tiny Tapeout"
  language:    "Verilog"
  clock_hz:    "10000000"

# Pinout definition
pinout:
  # Inputs
  ui[0]: "Parallel data input [0]"
  ui[1]: "Parallel data input [1]"
  ui[2]: "Parallel data input [2]"
  ui[3]: "Parallel data input [3]"
  ui[4]: "Parallel data input [4]"
  ui[5]: "Parallel data input [5]"
  ui[6]: "Parallel data input [6]"
  ui[7]: "Parallel data input [7]"

  # Outputs
  uo[0]: "Register output [0]"
  uo[1]: "Register output [1]"
  uo[2]: "Register output [2]"
  uo[3]: "Register output [3]"
  uo[4]: "Register output [4]"
  uo[5]: "Register output [5]"
  uo[6]: "Register output [6]"
  uo[7]: "Register output [7]"

  # Bidirectional pins (uio)
  uio[0]: "Mode control bit 0"
  uio[1]: "Mode control bit 1"
  uio[2]: "Serial input left (sin_left)"
  uio[3]: "Serial input right (sin_right)"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# The Pinout is compatible with Tiny Tapeout standard